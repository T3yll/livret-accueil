<!doctype html>
<!-- Servie par le service worker quand une page du livret n'a jamais été enregistrée et que le réseau manque. -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hors connexion · Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        background: #f7f5ef;
        color: #292b27;
        font-family: system-ui, sans-serif;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-weight: 500;
        font-size: 28px;
      }
      p {
        margin: 0;
        max-width: 32em;
        color: #646a66;
      }
      hr {
        width: 48px;
        border: 0;
        border-top: 1px solid #a48652;
        margin: 12px 0;
      }
      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #465b48;
        color: #fff;
        font: 600 15px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Pas de connexion</h1>
    <p>Cette page n'a pas encore été enregistrée sur votre téléphone. Elle s'affichera dès le retour du réseau.</p>
    <hr />
    <h1 lang="en">No connection</h1>
    <p lang="en">This page hasn't been saved on your phone yet. It will show as soon as you're back online.</p>
    <button type="button" onclick="location.reload()">Réessayer · <span lang="en">Try again</span></button>
  </body>
</html>
